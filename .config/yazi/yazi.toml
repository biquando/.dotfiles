[opener]
markdown = [
    { run = "termmd %s1", block = true, desc = "View Markdown" },
]
play = [
    { run = 'open %s', desc = "Play", orphan = true, for = "macos" }
]

[open]
prepend_rules = [
    { url = "*.md", use = ["markdown", "edit"] },
    { url = "*.markdown", use = ["markdown", "edit"] },
]

[mgr]
show_hidden = false

# For git.yazi
[[plugin.prepend_fetchers]]
url = "*"
run  = "git"
group = "git"

# For git.yazi
[[plugin.prepend_fetchers]]
url = "*/"
run  = "git"
group = "git"

# Disable previews in ~/mnt
# This doesn't seem to work
[[plugin.prepend_previewers]]
url = "~/mnt/**"
run = "noop"

# Disable preloading in ~/mnt
[[plugin.prepend_preloaders]]
url = "~/mnt/**"
run = "noop"

[preview]
max_width  = 1000
max_height = 1000
image_delay = 0
